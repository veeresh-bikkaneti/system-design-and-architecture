<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Design Mastery</title>
    <meta
      name="description"
      content="Learn system design progressively, from beginner to master, with an AI tutor that draws you the diagrams."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint so the page never
      // flashes the wrong color scheme. Mirrors src/store/display.ts —
      // keep the two in sync.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('sdm-display') || '{}');
          var theme = stored.state && stored.state.theme;
          var calm = stored.state && stored.state.calmMotion;
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (calm) document.documentElement.setAttribute('data-motion', 'calm');
        } catch (e) {
          /* storage unavailable — fall back to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
