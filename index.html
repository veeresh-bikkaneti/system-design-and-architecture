<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy (meta tag: GitHub Pages can't set response
      headers, so this is the only route). Deliberate trade-offs:
      - script-src has no 'unsafe-inline': the one inline script (theme boot
        below) is allowlisted by its sha256 hash. If you edit that script,
        recompute the hash or the theme boot will silently stop running.
      - style-src keeps 'unsafe-inline': motion/react and several components
        set styles via the style attribute; CSS injection is low-risk while
        script-src stays locked down.
      - 'wasm-unsafe-eval' lets Ben's local models compile WebAssembly. It
        allows WASM compilation only, not eval() of JavaScript; the runtime
        and the .wasm files are served by this site (src/ai/local/runtime.ts).
      - connect-src allows any https: because the AI tutor is provider-
        agnostic by design (user-configured endpoints). Narrow per-provider
        if you ever drop custom endpoints.
      - img-src is tight ('self', data:, YouTube thumbnails): a prompt-
        injected mermaid diagram can't exfiltrate via a remote <image>.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-4YWKEnBPEY4KQC/Wysp30Oe7tbyGO3p48I87C3noELI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Design Mastery</title>
    <meta
      name="description"
      content="Learn system design progressively, from beginner to master, with an AI tutor that draws you the diagrams."
    />
    <meta name="theme-color" content="#f5f0e6" />
    <!-- Site-level social preview tags. Route-specific tags are injected by
         scripts/seo/prerender.mjs for crawlers and by src/components/Seo.tsx
         during client-side navigation. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="System Design Mastery" />
    <meta
      property="og:title"
      content="System Design Mastery — Learn System Design from Zero to Master"
    />
    <meta
      property="og:description"
      content="Learn system design progressively, from beginner to master, with an AI tutor that draws you the diagrams."
    />
    <meta name="twitter:card" content="summary" />
    <!-- Site-level structured data: WebSite + Organization + Course. Only
         real, verifiable facts — no invented ratings, prices, or dates.
         JSON-LD is data, not executable script: the meta CSP does not block
         it. Per-lesson LearningResource nodes are injected per route by
         scripts/seo/prerender.mjs. -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "@id": "https://veeresh-bikkaneti.github.io/system-design-and-architecture/#website",
          "name": "System Design Mastery",
          "description": "Learn system design progressively, from beginner to master, with an AI tutor that draws you the diagrams.",
          "url": "https://veeresh-bikkaneti.github.io/system-design-and-architecture/"
        },
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "@id": "https://veeresh-bikkaneti.github.io/system-design-and-architecture/#organization",
          "name": "System Design Mastery",
          "url": "https://veeresh-bikkaneti.github.io/system-design-and-architecture/",
          "sameAs": ["https://github.com/veeresh-bikkaneti/system-design-and-architecture"]
        },
        {
          "@context": "https://schema.org",
          "@type": "Course",
          "@id": "https://veeresh-bikkaneti.github.io/system-design-and-architecture/#course",
          "name": "System Design Mastery",
          "description": "Learn system design progressively, from beginner to master, with an AI tutor that draws you the diagrams.",
          "url": "https://veeresh-bikkaneti.github.io/system-design-and-architecture/",
          "provider": {
            "@id": "https://veeresh-bikkaneti.github.io/system-design-and-architecture/#organization"
          },
          "numberOfLessons": 36,
          "isAccessibleForFree": true
        }
      ]
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint so the page never
      // flashes the wrong color scheme. Mirrors src/store/display.ts —
      // keep the two in sync.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('sdm-display') || '{}');
          var theme = stored.state && stored.state.theme;
          var calm = stored.state && stored.state.calmMotion;
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (calm) document.documentElement.setAttribute('data-motion', 'calm');
        } catch (e) {
          /* storage unavailable — fall back to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
