name = "system-design-mastery-cert"
main = "src/index.ts"
compatibility_date = "2026-09-10"

# Created with: wrangler d1 create system-design-mastery-cert
# Then replace database_id below with the id that command prints.
[[d1_databases]]
binding = "DB"
database_name = "system-design-mastery-cert"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# Self-hosted tutor model ("Veer"): a llama.cpp server on Liz's own machine,
# OpenAI-compatible. The Worker calls it over HTTPS -- no Cloudflare AI
# binding, no third-party AI subscription.
# The server must NOT be open to the internet: restrict it to Cloudflare's
# IP ranges or hide it behind a Cloudflare Tunnel, and require the bearer
# token below.
[vars]
# Origin of the OpenAI-compatible model API, e.g.
# https://llm.example.com/v1  (or the Cloudflare Tunnel hostname + /v1).
# Empty until the model server exists; the widget shows "Veer is getting
# ready" and /api/qa/chat answers AI_UNAVAILABLE while unset.
MODEL_BASE_URL = ""
# Alias served by the llama.cpp server (--alias). The shared bearer token
# is never in this file -- set it with: wrangler secret put MODEL_API_KEY
QA_MODEL_ID = "veer-tutor"
# Public GitHub OAuth App client id for the tutor sign-in flow. Liz pastes
# her OAuth App's Client ID here. The client SECRET is never in this file --
# set it with: wrangler secret put GITHUB_CLIENT_SECRET
GITHUB_CLIENT_ID = ""
# Origin the OAuth callback page postMessages the sign-in result to (the
# widget opens the flow in a popup and listens for it). Must exactly match
# the site origin or the widget will ignore the message.
PUBLIC_SITE_ORIGIN = "https://veeresh-bikkaneti.github.io"
