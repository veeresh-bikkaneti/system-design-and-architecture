# Runs Ben's routing gate (npm run eval:ben) on pull requests that touch Ben's files.
#
# ADVISORY FIRST (continue-on-error): the gate still has BATCH=32 noise (ticket #136
# part 2), so a red result here is a heads-up, not a verdict. The report lands in the
# run summary. Make it blocking only after that fix, or after ~10 clean PR runs.
#
# REQUIRED-CHECK TRAP: a path-filtered workflow that does not fire stays "Pending"
# forever and blocks every unrelated PR. Before adding this to the ruleset, drop
# `paths:` and add an always-reporting diff-based job. Do not add it as-is.
#
# HF RISK: ben:index downloads the model from a mutable Hugging Face `resolve/main`
# ref (SHA-256 pinned). An upstream outage can turn this red for unrelated reasons.
name: PR Ben eval

on:
  pull_request: # never pull_request_target: this runs the PR's own code
    paths:
      - 'src/ai/local/**'
      - 'scripts/ben/**'
      - 'scripts/seo/lesson-meta.mjs'
      - 'evals/ben/**'
      - 'content/lessons/**'
      - 'vitest.eval.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr-ben-eval.yml'

permissions:
  contents: read

concurrency:
  group: pr-ben-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ben-eval:
    name: Ben routing gate (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ben:index
      - name: Ben index determinism (model required, no skip)
        run: BEN_REQUIRE_MODEL=1 npx vitest run scripts/ben/build-index.determinism.test.ts
      - run: npm run eval:ben
      - name: Publish report to the run summary
        if: always()
        run: |
          if [ -f evals/ben/REPORT.md ]; then cat evals/ben/REPORT.md >> "$GITHUB_STEP_SUMMARY"; else echo "No REPORT.md was written." >> "$GITHUB_STEP_SUMMARY"; fi
