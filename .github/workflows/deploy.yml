name: Deploy to GitHub Pages

# Actions are pinned to commit SHAs (not mutable tags) to block tag-rewrite
# attacks. Dependabot (see .github/dependabot.yml) keeps the SHAs fresh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run content:check
      - run: npm run content:validate
      - run: npm run test
      # Fetches Ben's embedder from Hugging Face (SHA-256 pinned), builds the
      # lesson index, and gates routing quality. See docs/adr/0001-ben-semantic-routing.md.
      - run: npm run ben:index
      - run: npm run eval:ben

  worker-checks:
    name: Worker gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: E2E smoke tests
    needs: [checks, worker-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Throwaway build for testing only (no VITE_BASE_PATH): the e2e spec
      # serves the app at the server root. The deployable artifact with the
      # Pages base path is built separately in the `build` job.
      - run: npm run build
      - run: npm run test:e2e

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: surfaces in the Actions UI without blocking deploys.
    # Dependabot (.github/dependabot.yml) files PRs for real findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high --package-lock-only
      - run: npm audit --audit-level=high --package-lock-only
        working-directory: worker

  build:
    needs: [checks, worker-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Optional GitHub sign-in (see worker/README.md). Public values, set
          # as repository *variables*; unset means the pasted-token fallback.
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          # Veer tutor API origin (Manifest 2). Public value, not a secret:
          # the widget offers the Veer sign-in/mode only when this is set at
          # build time; empty would hide Veer entirely (Ben-only build).
          VITE_QA_API_BASE: https://system-design-mastery-cert.knowledgetest.workers.dev
          # Ko-fi ask (see src/components/kofi/). Public URL, set as a
          # repository *variable*; unset means the ask renders nothing.
          VITE_KOFI_URL: ${{ vars.VITE_KOFI_URL }}
          # Contact form spam check (see src/pages/ContactPage.tsx). Public
          # site key, set as a repository *variable*; unset means the form
          # renders its not-configured notice instead of sending.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-mirror:
    name: Deploy to Cloudflare mirror
    needs: [checks, worker-checks, e2e]
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-mirror
      url: https://systemdesignandarchitecture.knowledgetest.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same build as the Pages artifact, different base: the mirror serves
      # the site at its root. WORKERS_CI=1 keeps the ONNX asyncify WASM
      # (25.6 MiB, over the Workers per-asset cap) out of the upload —
      # scripts/ben/embedder.mjs — so Ben on the mirror uses the plain
      # WASM build, as it did under Cloudflare Workers Builds. The build
      # gets its own job because prerender hardcodes dist/: the two
      # surfaces' builds can never share a workspace.
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          WORKERS_CI: "1"
          # Same public build-time values as the `build` job above.
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_QA_API_BASE: https://system-design-mastery-cert.knowledgetest.workers.dev
          VITE_KOFI_URL: ${{ vars.VITE_KOFI_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi
      # Wrangler is worker/'s pinned devDependency; invoking it from
      # worker/ (deploy-worker.yml's pattern) keeps one wrangler version
      # for both Cloudflare deploys. The config's assets directory
      # resolves relative to the config file (the repo root's dist/).
      - run: npm ci
        working-directory: worker
      - run: npx wrangler deploy --config ../wrangler.mirror.toml
        working-directory: worker
