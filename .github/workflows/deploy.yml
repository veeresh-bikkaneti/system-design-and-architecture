name: Deploy to GitHub Pages

# Actions are pinned to commit SHAs (not mutable tags) to block tag-rewrite
# attacks. Dependabot (see .github/dependabot.yml) keeps the SHAs fresh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run content:check
      - run: npm run content:validate
      - run: npm run test
      # Fetches Ben's embedder from Hugging Face (SHA-256 pinned), builds the
      # lesson index, and gates routing quality. See docs/adr/0001-ben-semantic-routing.md.
      - run: npm run ben:index
      - run: npm run eval:ben

  worker-checks:
    name: Worker gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: E2E smoke tests
    needs: [checks, worker-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Throwaway build for testing only (no VITE_BASE_PATH): the e2e spec
      # serves the app at the server root. The deployable artifact with the
      # Pages base path is built separately in the `build` job.
      - run: npm run build
      - run: npm run test:e2e

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: surfaces in the Actions UI without blocking deploys.
    # Dependabot (.github/dependabot.yml) files PRs for real findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm audit --audit-level=high --package-lock-only
      - run: npm audit --audit-level=high --package-lock-only
        working-directory: worker

  build:
    needs: [checks, worker-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
