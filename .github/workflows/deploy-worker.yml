name: Deploy Worker (Cloudflare)

# Manual only: run it from the Actions tab once the secrets below exist. It
# deploys worker/ (the exam + auth + GitHub OAuth-exchange API) to Cloudflare;
# the course site itself is deployed by deploy.yml and does not depend on this.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN      API token with Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID     the account that owns the D1 database
#   OAUTH_GITHUB_CLIENT_ID    optional: GitHub OAuth app client id
#   OAUTH_GITHUB_CLIENT_SECRET optional: GitHub OAuth app client secret
# (GitHub reserves the GITHUB_ prefix for secret names, hence OAUTH_GITHUB_*;
# they are stored on the Worker as GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET.)
# Actions are pinned to commit SHAs, same as deploy.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Test, migrate, deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply system-design-mastery-cert --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Store GitHub OAuth secrets on the Worker
        env:
          OAUTH_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          if [ -n "$OAUTH_ID" ] && [ -n "$OAUTH_SECRET" ]; then
            printf '%s' "$OAUTH_ID" | npx wrangler secret put GITHUB_CLIENT_ID
            printf '%s' "$OAUTH_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET
          else
            echo "OAuth secrets not provided; GitHub sign-in stays on the pasted-token path."
          fi
